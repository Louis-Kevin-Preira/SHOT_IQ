plugins {
    id 'com.android.application'
}

// Numéro de version : celui de l'exécution GitHub dans le cloud, 1 en local.
// Calculé à part, avant le bloc android : écrit directement dans
// versionCode, Groovy le lirait comme un appel de fonction.
def ciVersion = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")

android {
    namespace 'com.fable.shotiq'
    compileSdk 34

    defaultConfig {
        applicationId "com.fable.shotiq"
        minSdk 24
        targetSdk 34
        // Le numéro monte à chaque compilation dans le cloud, sinon Android
        // refuse d'installer par-dessus la version en place.
        versionCode ciVersion
        versionName "1.0.${ciVersion}"
    }

    // Clé de signature fixe, incluse dans le projet.
    // Sans elle, chaque compilation utiliserait une clé de débogage différente
    // et l'installation échouerait par-dessus la version précédente.
    signingConfigs {
        shotiq {
            storeFile file("../keystore/shotiq.jks")
            storePassword "shotiq2024"
            keyAlias "shotiq"
            keyPassword "shotiq2024"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shotiq
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shotiq
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
