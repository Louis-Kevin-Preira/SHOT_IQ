name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Compiler SHOT IQ
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # "tools" est un paquet retiré du dépôt Google ; on ne demande que
          # ce qui existe encore. Gradle télécharge tout seul, pendant la
          # compilation, la plateforme et les build-tools dont il a besoin.
          packages: "platform-tools"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Recopier l'application web dans les ressources
        run: |
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp index.html sw.js manifest.webmanifest "$DEST/"
          cp -r icons media "$DEST/"

      - name: Compiler l'APK de test
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Compiler l'APK de version, non signé
        working-directory: android
        run: gradle assembleRelease --no-daemon || true

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: shot-iq-apk-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publier l'APK de version
        uses: actions/upload-artifact@v4
        with:
          name: shot-iq-apk-version-non-signe
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 90
